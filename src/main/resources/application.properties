spring.application.name=apicustomer

# Server Configuration
server.port=9090

# Resilience and application observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,retries,retryevents
resilience4j.circuitbreaker.circuit-breaker-aspect-order=-2
resilience4j.retry.retry-aspect-order=-1

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/customerdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Users upstream API
users.api.base-url=http://localhost:5000
users.api.read-timeout=3s
